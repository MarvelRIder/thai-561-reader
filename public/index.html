<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เปิดอ่าน 56-1 One Report</title>
<style>
  :root {
    --bg: #06090a;
    --card-top: rgba(32, 66, 46, 0.65);
    --card-bot: rgba(6, 12, 10, 0.9);
    --text: #f2f6f4;
    --muted: #93a49b;
    --accent: #3ddc84;
    --accent-soft: rgba(61, 220, 132, 0.16);
    --border: rgba(255, 255, 255, 0.08);
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Noto Sans Thai", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 480px; height: 480px;
    top: -160px; left: 50%;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(61, 220, 132, 0.28), transparent 70%);
  }
  body::after {
    width: 380px; height: 380px;
    bottom: -140px; right: -60px;
    background: radial-gradient(circle, rgba(34, 197, 94, 0.16), transparent 70%);
  }
  header, .wrap { position: relative; z-index: 1; }
  header {
    padding: 40px 20px 12px;
    text-align: center;
  }
  header h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 60px; }
  form.search {
    display: flex;
    gap: 10px;
    margin: 24px 0;
  }
  input[type="text"] {
    flex: 1;
    padding: 14px 16px;
    font-size: 1rem;
    font-family: inherit;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]::placeholder { color: #5c6b63; }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button {
    padding: 14px 24px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #06110a;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(61, 220, 132, 0.55);
    transition: filter 0.15s, transform 0.1s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button:disabled { background: #37423c; color: #7c8a82; box-shadow: none; cursor: default; }
  .card {
    background: linear-gradient(165deg, var(--card-top), var(--card-bot));
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px 24px;
    margin-bottom: 16px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.04),
      0 30px 60px -34px rgba(0, 0, 0, 0.8),
      0 0 40px -18px rgba(61, 220, 132, 0.35);
  }
  .company-name { font-weight: 700; font-size: 1.15rem; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
  .hint { color: var(--muted); font-size: 0.82rem; margin-bottom: 14px; line-height: 1.5; }
  .year-list { display: flex; flex-direction: column; gap: 4px; }
  .year-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .year-row:first-child { border-top: none; }
  .year-link {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 999px;
    background: transparent;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.88rem;
    border: 1px solid rgba(61, 220, 132, 0.4);
    font-weight: 500;
    transition: background 0.15s, filter 0.15s;
  }
  .year-link.primary {
    background: var(--accent);
    color: #06110a;
    border-color: var(--accent);
    font-weight: 700;
    box-shadow: 0 8px 22px -10px rgba(61, 220, 132, 0.65);
  }
  .year-link:hover { filter: brightness(1.1); background: rgba(61, 220, 132, 0.1); }
  .year-link.primary:hover { background: var(--accent); }
  .year-link-en {
    font-size: 0.8rem;
    color: var(--muted);
    text-decoration: underline;
  }
  .attach-btn {
    background: none;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 400;
    box-shadow: none;
    cursor: pointer;
  }
  .attach-btn:hover { background: rgba(255, 255, 255, 0.05); filter: none; }
  .attach-box {
    flex-basis: 100%;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .attach-box a { color: var(--accent); margin-right: 10px; }
  .alt-list { list-style: none; padding: 0; margin: 0; }
  .alt-list li {
    padding: 12px 0;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .alt-list li:first-child { border-top: none; }
  .alt-name { font-size: 0.92rem; }
  .alt-score { color: var(--muted); font-size: 0.78rem; }
  .pick-btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 400;
    box-shadow: none;
    cursor: pointer;
    white-space: nowrap;
  }
  .pick-btn:hover { background: rgba(255, 255, 255, 0.05); filter: none; }
  .status { color: var(--muted); font-size: 0.9rem; margin: 10px 0; min-height: 1.2em; }
  .error { color: var(--danger); }
  .alt-hint { color: var(--muted); font-size: 0.82rem; margin-top: -6px; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <h1>📄 เปิดอ่าน 56-1 One Report</h1>
  <p>พิมพ์ชื่อย่อหุ้นไทย แล้วเปิดอ่านรายงาน 56-1 ได้ทันที ไม่ต้องดาวน์โหลดหรือแตกไฟล์เอง</p>
</header>

<div class="wrap">
  <form class="search" id="searchForm">
    <input type="text" id="symbolInput" placeholder="เช่น PTT, CPALL, AOT, KBANK ..." autocomplete="off" autofocus />
    <button type="submit" id="searchBtn">ค้นหา</button>
  </form>

  <div class="status" id="status"></div>
  <div id="results"></div>
</div>

<script>
const form = document.getElementById('searchForm');
const input = document.getElementById('symbolInput');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const searchBtn = document.getElementById('searchBtn');

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (q) runSearch(q);
});

async function runSearch(q) {
  resultsEl.innerHTML = '';
  statusEl.textContent = `กำลังค้นหา "${q}" ...`;
  statusEl.classList.remove('error');
  searchBtn.disabled = true;
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'เกิดข้อผิดพลาด');

    const hasAlternates = data.alternates && data.alternates.length > 0;

    if (!data.best && !data.fund && !hasAlternates) {
      statusEl.textContent = data.yahoo.length
        ? `ไม่พบข้อมูลบริษัทที่ตรงกับ "${q}"`
        : `ไม่พบข้อมูลบริษัทที่ตรงกับ "${q}" (หาชื่อบริษัทไม่เจอชั่วคราว ลองค้นหาอีกครั้ง)`;
      statusEl.classList.add('error');
      return;
    }

    if (data.best || data.fund) {
      statusEl.textContent = data.yahoo.length
        ? `จับคู่กับ: ${data.yahoo.map(y => y.symbol.replace('.BK','') + ' (' + y.longname + ')').join(', ')}`
        : '';
    } else {
      // No confident match, but there are lower-confidence guesses — let the
      // user pick one instead of a flat "not found".
      statusEl.textContent = `ไม่พบบริษัทที่ตรงกับ "${q}" แบบชัดเจน แต่นี่คือรายชื่อใกล้เคียงที่พอเป็นไปได้:`;
    }

    if (data.fund) {
      renderFund(data.fund);
    }
    if (data.best) {
      renderBest(data.best);
    }
    if (hasAlternates) {
      renderAlternates(data.alternates);
    }
  } catch (err) {
    statusEl.textContent = 'ค้นหาไม่สำเร็จ: ' + err.message;
    statusEl.classList.add('error');
  } finally {
    searchBtn.disabled = false;
  }
}

function renderFund(fund) {
  const card = document.createElement('div');
  card.className = 'card';
  const rows = fund.filings
    .map(
      (f, i) => `
        <div class="year-row">
          <a class="year-link ${i === 0 ? 'primary' : ''}" href="/api/fund-report?url=${encodeURIComponent(f.url)}" target="_blank" rel="noopener">เปิดอ่านรายงานประจำปี ${f.year}</a>
        </div>`
    )
    .join('');
  card.innerHTML = `
    <div class="company-name">${fund.name} (${fund.shortName})</div>
    <div class="meta">กองทุนรวมโครงสร้างพื้นฐาน/อสังหาริมทรัพย์ — ไม่ยื่นแบบ 56-1 แต่มีรายงานประจำปีของกองทุนแทน · พบทั้งหมด ${fund.filings.length} ปี</div>
    <div class="hint">กด "เปิดอ่าน" จะเปิด PDF ในแท็บใหม่ด้วยตัวอ่านของเบราว์เซอร์เอง</div>
    <div class="year-list">${rows}</div>
  `;
  resultsEl.appendChild(card);
}

function renderBest(best) {
  const card = document.createElement('div');
  card.className = 'card';
  const rows = best.filings
    .map((f, i) => {
      const base = `name=${encodeURIComponent(best.name)}&year=${encodeURIComponent(f.year)}`;
      const thUrl = `/api/report?${base}&lang=th`;
      const enUrl = `/api/report?${base}&lang=en`;
      return `
        <div class="year-row">
          <a class="year-link ${i === 0 ? 'primary' : ''}" href="${thUrl}" target="_blank" rel="noopener">เปิดอ่าน 56-1 ปี ${f.year} (ไทย)</a>
          <a class="year-link-en" href="${enUrl}" target="_blank" rel="noopener">English</a>
          <button type="button" class="attach-btn" data-name="${encodeURIComponent(best.name)}" data-year="${f.year}">เอกสารแนบ</button>
          <div class="attach-box" hidden></div>
        </div>`;
    })
    .join('');
  card.innerHTML = `
    <div class="company-name">${best.name}</div>
    <div class="meta">พบรายงาน 56-1 ทั้งหมด ${best.filings.length} ปี · ยื่นล่าสุด ${best.filings[0].receiveDate}</div>
    <div class="hint">กด "เปิดอ่าน" จะเปิด PDF ฉบับภาษาไทยในแท็บใหม่ด้วยตัวอ่านของเบราว์เซอร์เอง เลื่อน/ซูมได้ตามปกติ (ถ้าไม่มีฉบับไทยจะเปิดฉบับอังกฤษแทนโดยอัตโนมัติ)</div>
    <div class="year-list">${rows}</div>
  `;
  resultsEl.appendChild(card);

  card.querySelectorAll('.attach-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const box = btn.nextElementSibling;
      if (!box.hidden) {
        box.hidden = true;
        return;
      }
      box.hidden = false;
      box.textContent = 'กำลังโหลดรายการเอกสาร...';
      const name = decodeURIComponent(btn.dataset.name);
      const year = btn.dataset.year;
      try {
        const res = await fetch(`/api/report-list?name=${encodeURIComponent(name)}&year=${encodeURIComponent(year)}&lang=th`);
        const data = await res.json();
        if (res.ok && data.entries && data.entries.length) {
          box.innerHTML = data.entries
            .map(
              (e) =>
                `<a href="/api/report?name=${encodeURIComponent(name)}&year=${encodeURIComponent(year)}&lang=${data.lang}&entry=${encodeURIComponent(e.entryName)}" target="_blank" rel="noopener">${e.entryName}</a>`
            )
            .join(' ');
        } else {
          box.textContent = 'ไม่พบเอกสารแนบเพิ่มเติม';
        }
      } catch (e) {
        box.textContent = 'โหลดรายการเอกสารไม่สำเร็จ';
      }
    });
  });
}

function renderAlternates(alts) {
  const card = document.createElement('div');
  card.className = 'card';
  const items = alts
    .map(
      (a) => `<li>
        <span class="alt-name">${a.name}<br/><span class="alt-score">คะแนนความตรงกัน ${(a.score * 100).toFixed(0)}%</span></span>
        <button class="pick-btn" data-name="${encodeURIComponent(a.name)}">ใช้บริษัทนี้แทน</button>
      </li>`
    )
    .join('');
  card.innerHTML = `<div class="alt-hint">ไม่ใช่บริษัทที่ต้องการ? เลือกจากรายชื่อใกล้เคียง:</div><ul class="alt-list">${items}</ul>`;
  resultsEl.appendChild(card);
  card.querySelectorAll('.pick-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const name = decodeURIComponent(btn.dataset.name);
      const alt = alts.find((a) => a.name === name);
      resultsEl.innerHTML = '';
      renderBest(alt);
    });
  });
}
</script>
</body>
</html>
